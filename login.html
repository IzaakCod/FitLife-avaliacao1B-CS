        <h1>Cadastro de Usuário</h1>
    </header>
    <main>
        <form onsubmit="alert('Foi!')">

            <input type="hidden" name="id" value="10">

            <label class="titulo" for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" minlength="5" maxlength="15" required=""><br>

            <label class="titulo" for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" maxlength="11" pattern="[0-9]{11}" required=""><br>

            <label class="titulo" for="email">Email:</label>
            <input type="email" id="email" name="email" required=""><br>

            <label class="titulo" for="data">Data de nascimento:</label>
            <input type="date" id="data" name="dataNascimento" required=""><br>

            <label class="titulo-genero">Gênero:</label>

            <div class="radio-group">
                <label class="radio-label">
                    Masculino
                    <input type="radio" name="genero" value="M">
                </label><br>

                <label class="radio-label">
                    Feminino
                    <input type="radio" name="genero" value="F">
                </label><br>

                <label class="radio-label">
                    Prefiro não informar
                    <input type="radio" name="genero" value="N">
                </label>
            </div>

            <label class="titulo" for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" minlength="6" required=""><br>

            <label class="titulo" for="obs">Observações:</label>
            <textarea name="observacoes" id="obs" rows="4" cols="30"></textarea><br>
            
            <label><b>Calcule seu IMC:</b></label>

            <div style="margin-bottom: 15px; margin-top: 10px;">
                <label class="titulo" for="peso">Peso (Kg):</label>
                <input type="text" id="peso" name="peso"  placeholder="Ex: 15.50Kg">
            </div>

            <label class="titulo" for="altura" ;>Altura (cm):</label>
            <input type="text" id="altura" name="altura"  placeholder="Ex: 1.80cm">
            
            <button type="button" style="margin-top: 5px; 
            border-radius: 10px; padding: 10px 15px; display: block;" onclick="calcularIMC()">Calcular imc</button>

            <p id="resultado" style="color: black;"></p>
            
            <input type="submit" value="Cadastrar Usuário" style="margin-top: 20px; 
            border-radius: 10px; padding: 10px 15px; display: block;">
        </form>
    </main>
